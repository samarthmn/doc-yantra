name: Publish DocYantra GitHub packages

on:
  push:
    tags:
      - "0.0.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: docyantra-github-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/0.0.') && github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com
          scope: "@samarthmn"
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@11.5.1
      - name: Set up pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --target wasm32-unknown-unknown
      - name: Install pinned Rust license inventory tool
        run: cargo install --locked --features cli cargo-about@0.9.2

      - name: Validate tag, commit, and lockstep versions
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tagged commit ${GITHUB_SHA} is not on origin/main" >&2
            exit 1
          }
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const version = process.env.GITHUB_REF.slice("refs/tags/".length);
          const packages = [
            "pdf-core/wasm/pkg/package.json",
            "office-core/wasm/pkg/package.json",
            "packages/doc-yantra-fonts/package.json",
            "packages/dockosha-provider/package.json",
          ];
          for (const path of packages) {
            const manifest = JSON.parse(readFileSync(path, "utf8"));
            if (manifest.version !== version) throw new Error(`${path}: expected ${version}, found ${manifest.version}`);
          }
          const adapter = JSON.parse(readFileSync("packages/dockosha-provider/package.json", "utf8"));
          for (const name of ["@samarthmn/doc-yantra", "@samarthmn/doc-yantra-office"]) {
            if (adapter.dependencies[name] !== version) throw new Error(`${name} is not pinned to ${version}`);
          }
          if (adapter.peerDependencies["@samarthmn/doc-yantra-fonts"] !== version) {
            throw new Error(`font peer is not pinned to ${version}`);
          }
          NODE

      - name: Verify locked notices and committed artifacts
        run: |
          scripts/generate-rust-license-notices.sh --check
          node scripts/source-fingerprint.mjs pdf --verify pdf-core/wasm/pkg/build-fingerprint.json
          node scripts/source-fingerprint.mjs office --verify office-core/wasm/pkg/build-fingerprint.json
          node scripts/source-fingerprint.mjs adapter --verify packages/dockosha-provider/build-fingerprint.json
          node scripts/wasm-version.mjs verify pdf-core/wasm/Cargo.toml pdf-core/wasm/pkg
          node scripts/wasm-version.mjs verify office-core/wasm/Cargo.toml office-core/wasm/pkg

      - name: Regenerate engines and require byte-identical packages
        run: |
          ./pdf-core/wasm/build.sh
          ./office-core/wasm/build.sh
          git diff --exit-code -- pdf-core/wasm/pkg office-core/wasm/pkg

      - name: Regenerate adapter from the exact engine packages
        run: |
          mkdir -p tmp/local-packages
          (cd pdf-core/wasm/pkg && npm pack --ignore-scripts --pack-destination ../../../tmp/local-packages)
          (cd office-core/wasm/pkg && npm pack --ignore-scripts --pack-destination ../../../tmp/local-packages)
          VERSION="${GITHUB_REF#refs/tags/}"
          cd packages/dockosha-provider
          npm install --ignore-scripts --no-save --package-lock=false \
            "../../tmp/local-packages/samarthmn-doc-yantra-${VERSION}.tgz" \
            "../../tmp/local-packages/samarthmn-doc-yantra-office-${VERSION}.tgz"
          npm run build
          cd ../..
          node scripts/source-fingerprint.mjs adapter --out packages/dockosha-provider/build-fingerprint.json
          git diff --exit-code -- packages/dockosha-provider/dist packages/dockosha-provider/build-fingerprint.json

      - name: Audit the exact release payload
        run: |
          node scripts/package-audit.mjs
          node scripts/export-public-source.mjs --check-only
          scripts/clean-export-smoke.sh
          node --test tests/all.test.mjs
          cargo test --manifest-path pdf-core/Cargo.toml --no-default-features --features wasm
          cargo test --manifest-path office-core/Cargo.toml
          node scripts/verify-font-cdn.mjs

      - name: Build and verify named consumer release assets
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ASSET_DIR="tmp/release-assets-${VERSION}"
          node scripts/create-release-assets.mjs --out-dir "$ASSET_DIR"
          node scripts/verify-release-assets.mjs \
            --core "$ASSET_DIR/doc-yantra-wasm-core-${VERSION}.zip" \
            --fonts "$ASSET_DIR/doc-yantra-fonts-offline-${VERSION}.tgz"

      - name: Publish integrity-addressed packages to GitHub Packages
        run: node scripts/publish-npm.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update GitHub release
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ASSET_DIR="tmp/release-assets-${VERSION}"
          NOTES="$ASSET_DIR/RELEASE-NOTES.md"
          printf '%s\n' \
            "## Consumer downloads" \
            "" \
            "- **doc-yantra-wasm-core-${VERSION}.zip** — PDF, Office, and adapter npm tarballs." \
            "- **doc-yantra-fonts-offline-${VERSION}.tgz** — optional offline font package." \
            > "$NOTES"
          CORE="$ASSET_DIR/doc-yantra-wasm-core-${VERSION}.zip"
          FONTS="$ASSET_DIR/doc-yantra-fonts-offline-${VERSION}.tgz"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "DocYantra ${VERSION}" --notes-file "$NOTES"
            gh release upload "$VERSION" "$CORE" "$FONTS" --clobber
          else
            gh release create "$VERSION" "$CORE" "$FONTS" \
              --verify-tag --title "DocYantra ${VERSION}" --notes-file "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
