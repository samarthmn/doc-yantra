name: Publish wasm packages

# Publishes @samarthmn/doc-yantra to GitHub Packages when a version tag is
# pushed, e.g.  git tag 0.0.3 && git push origin 0.0.3
# (pdf-core/scripts/release.sh does this for you.)
on:
  push:
    tags:
      - "0.0.*"
  # NOTE: the test gate lives in pdf-core/scripts/release.sh (CI is waived by
  # decision). This workflow only builds + publishes — a tag pushed by any means
  # OTHER than release.sh (including a workflow_dispatch run below, or a manual
  # `npm publish`) bypasses the tests. Always cut releases via release.sh.
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets the built-in GITHUB_TOKEN publish to GitHub Packages
    defaults:
      run:
        working-directory: pdf-core/wasm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node + GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@samarthmn"

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm package
        run: ./build.sh

      - name: Publish to GitHub Packages
        working-directory: pdf-core/wasm/pkg
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # office-core rides the same 0.0.* tags. Its publish runs after pdf-core's
      # and is independent — a failure here does not un-publish pdf-core; re-run
      # the job to retry (npm refuses double-publish, so we guard with a skip).
      - name: Build office-core wasm package
        working-directory: office-core/wasm
        run: ./build.sh

      - name: Publish office package to GitHub Packages
        working-directory: office-core/wasm/pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@samarthmn/doc-yantra-office@${VERSION}" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@samarthmn/doc-yantra-office@${VERSION} already published — skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
