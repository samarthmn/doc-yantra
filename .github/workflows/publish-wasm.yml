name: Publish wasm packages

# Publishes the four lockstep npm packages and creates named consumer assets
# when the local release script pushes a version tag, e.g. 0.0.21.
on:
  push:
    tags:
      - "0.0.*"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create/upload the named GitHub Release assets
      packages: write # lets the built-in GITHUB_TOKEN publish to GitHub Packages
    defaults:
      run:
        working-directory: pdf-core/wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node + GitHub Packages registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@samarthmn"

      # release.sh builds and tests locally before it creates this tag. GitHub
      # validates release identity, then publishes those committed artifacts.
      - name: Validate tag and package versions
        working-directory: .
        run: |
          case "${GITHUB_REF}" in
            refs/tags/0.0.*) TAG_VERSION="${GITHUB_REF#refs/tags/}" ;;
            *) echo "Publishing requires a 0.0.* tag ref; got ${GITHUB_REF}." >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "Tagged commit ${GITHUB_SHA} is not on origin/main." >&2
            exit 1
          }
          PDF_VERSION="$(node -p "require('./pdf-core/wasm/pkg/package.json').version")"
          OFFICE_VERSION="$(node -p "require('./office-core/wasm/pkg/package.json').version")"
          FONT_VERSION="$(node -p "require('./packages/doc-yantra-fonts/package.json').version")"
          ADAPTER_VERSION="$(node -p "require('./packages/dockosha-provider/package.json').version")"
          ADAPTER_PDF_PIN="$(node -p "require('./packages/dockosha-provider/package.json').dependencies['@samarthmn/doc-yantra']")"
          ADAPTER_OFFICE_PIN="$(node -p "require('./packages/dockosha-provider/package.json').dependencies['@samarthmn/doc-yantra-office']")"
          ADAPTER_FONT_PIN="$(node -p "require('./packages/dockosha-provider/package.json').peerDependencies['@samarthmn/doc-yantra-fonts']")"
          test "${TAG_VERSION}" = "${PDF_VERSION}" || {
            echo "Tag ${TAG_VERSION} does not match PDF package ${PDF_VERSION}." >&2
            exit 1
          }
          test "${TAG_VERSION}" = "${OFFICE_VERSION}" || {
            echo "Tag ${TAG_VERSION} does not match Office package ${OFFICE_VERSION}." >&2
            exit 1
          }
          test "${TAG_VERSION}" = "${FONT_VERSION}" || {
            echo "Tag ${TAG_VERSION} does not match font package ${FONT_VERSION}." >&2
            exit 1
          }
          test "${TAG_VERSION}" = "${ADAPTER_VERSION}" || {
            echo "Tag ${TAG_VERSION} does not match DocKosha adapter ${ADAPTER_VERSION}." >&2
            exit 1
          }
          test "${TAG_VERSION}" = "${ADAPTER_PDF_PIN}" || {
            echo "Tag ${TAG_VERSION} does not match adapter PDF pin ${ADAPTER_PDF_PIN}." >&2
            exit 1
          }
          test "${TAG_VERSION}" = "${ADAPTER_OFFICE_PIN}" || {
            echo "Tag ${TAG_VERSION} does not match adapter Office pin ${ADAPTER_OFFICE_PIN}." >&2
            exit 1
          }
          test "${TAG_VERSION}" = "${ADAPTER_FONT_PIN}" || {
            echo "Tag ${TAG_VERSION} does not match adapter font peer ${ADAPTER_FONT_PIN}." >&2
            exit 1
          }
          node scripts/source-fingerprint.mjs pdf --verify pdf-core/wasm/pkg/build-fingerprint.json
          node scripts/source-fingerprint.mjs office --verify office-core/wasm/pkg/build-fingerprint.json
          node scripts/wasm-version.mjs verify pdf-core/wasm/Cargo.toml pdf-core/wasm/pkg
          node scripts/wasm-version.mjs verify office-core/wasm/Cargo.toml office-core/wasm/pkg
          node scripts/package-audit.mjs

      # Publishing is intentionally blocked until every content-addressed URL
      # serves the exact canonical bytes with immutable caching and CORS.
      - name: Verify first-party font assets
        working-directory: .
        run: node scripts/verify-font-cdn.mjs

      - name: Publish offline font package to GitHub Packages
        working-directory: packages/doc-yantra-fonts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@samarthmn/doc-yantra-fonts@${VERSION}" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@samarthmn/doc-yantra-fonts@${VERSION} already published — skipping."
          else
            npm publish --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish PDF package to GitHub Packages
        working-directory: pdf-core/wasm/pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@samarthmn/doc-yantra@${VERSION}" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@samarthmn/doc-yantra@${VERSION} already published — skipping."
          else
            npm publish --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A retry may encounter an already published PDF package, so the Office
      # publish keeps the same idempotent guard.
      - name: Publish office package to GitHub Packages
        working-directory: office-core/wasm/pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@samarthmn/doc-yantra-office@${VERSION}" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@samarthmn/doc-yantra-office@${VERSION} already published — skipping."
          else
            npm publish --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the adapter only after both of its exact-pinned engine
      # dependencies exist. Retries keep the same immutable-version guard.
      - name: Publish DocKosha adapter to GitHub Packages
        working-directory: packages/dockosha-provider
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@samarthmn/dockosha-provider-docyantra@${VERSION}" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@samarthmn/dockosha-provider-docyantra@${VERSION} already published — skipping."
          else
            npm publish --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify named consumer release assets
        working-directory: .
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ASSET_DIR="tmp/release-assets-${VERSION}"
          node scripts/create-release-assets.mjs --out-dir "${ASSET_DIR}"
          node scripts/verify-release-assets.mjs \
            --core "${ASSET_DIR}/doc-yantra-wasm-core-${VERSION}.zip" \
            --fonts "${ASSET_DIR}/doc-yantra-fonts-offline-${VERSION}.tgz"

      - name: Create or update GitHub Release
        working-directory: .
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ASSET_DIR="tmp/release-assets-${VERSION}"
          NOTES="${ASSET_DIR}/RELEASE-NOTES.md"
          cat > "${NOTES}" <<EOF
          ## Consumer downloads

          - **doc-yantra-wasm-core-${VERSION}.zip** — installable PDF, Office, and adapter npm tarballs only, plus checksums and install instructions.
          - **doc-yantra-fonts-offline-${VERSION}.tgz** — optional exact-font pack for fully offline conversion.

          GitHub's automatic **Source code (zip)** and **Source code (tar.gz)** links contain the complete development repository and are not consumer packages.
          EOF
          CORE="${ASSET_DIR}/doc-yantra-wasm-core-${VERSION}.zip"
          FONTS="${ASSET_DIR}/doc-yantra-fonts-offline-${VERSION}.tgz"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" \
              --title "DocYantra ${VERSION}" \
              --notes-file "${NOTES}"
            gh release upload "${VERSION}" "${CORE}" "${FONTS}" --clobber
          else
            gh release create "${VERSION}" "${CORE}" "${FONTS}" \
              --verify-tag \
              --title "DocYantra ${VERSION}" \
              --notes-file "${NOTES}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
