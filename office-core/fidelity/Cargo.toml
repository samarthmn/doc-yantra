[package]
name = "fidelity"
version = "0.0.0"
edition = "2024"
publish = false

# Dev-only fidelity harness: converts corpus cases with office-core, rasterizes
# both our output and the Word ground truth via pdf-core's pdfium, and scores
# similarity (SSIM). Never published, never wasm.

[dependencies]
office-core = { path = ".." }
pdf-core = { path = "../../pdf-core", default-features = false, features = ["pdfium"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
