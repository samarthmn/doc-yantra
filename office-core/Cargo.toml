[package]
name = "office-core"
version = "0.0.28"            # keep in lockstep with pdf-core's current version line
edition = "2024"
rust-version = "1.89"
description = "AGPL-licensed DocYantra Office-to-PDF engine: DOCX/PPTX/XLSX layout and PDF emission, pure Rust"
license = "AGPL-3.0-or-later"
publish = false
# Integration tests live in the repository-wide tests/ folder.
autotests = false

[lib]
name = "office_core"

[[bin]]
name = "officecore"
path = "src/bin/officecore.rs"
required-features = ["cli"]

[features]
default = ["cli", "bundled-fonts"]
cli = ["dep:clap"]
# Embeds native fixture fonts plus shared faces from packages/doc-yantra-fonts.
# This remains for hermetic native tests/fidelity only.
# Production wasm disables default features and receives fonts from the host.
bundled-fonts = []
# wasm32 builds: JS crypto for any randomness pulled in transitively.
wasm = []
# Native/wasm-safe serializable line traces for the fidelity harness.
fidelity-diagnostics = []

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
ttf-parser = "0.25"
subsetter = "0.2"
unicode-linebreak = "0.1"
unicode-bidi = "0.3"
unicode-normalization = "0.1"
unicode-segmentation = "1"
text-core = { path = "../text-core" }
pdf-writer = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# `benchmark` is an empty upstream feature that exposes the audited integer FDCT.
jpeg-encoder = { version = "=0.7.0", default-features = false, features = ["benchmark"] }
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
serial_test = "3"

# The fidelity harness has its own workspace and lockfile. Public Office checks
# must not resolve its pdfium/corpus-only dependency graph.
[workspace]
# The wasm crate is built standalone by wasm/build.sh (wasm-pack), not as a
# workspace member.
exclude = ["wasm"]

[[test]]
name = "cff_pdfjs_compat_test"
path = "../tests/office-core/cff_pdfjs_compat_test.rs"

