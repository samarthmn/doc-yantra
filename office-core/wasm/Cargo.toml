[package]
name = "office-core-wasm"
version = "0.0.18"
edition = "2024"
rust-version = "1.89"
description = "DocKosha office-core Office->PDF engine compiled to WebAssembly (Node/Vercel + browser)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
office-core = { path = "..", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
