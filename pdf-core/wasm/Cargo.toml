[package]
name = "pdf-core-wasm"
version = "0.0.4"
edition = "2024"
rust-version = "1.89"
description = "DocKosha pdf-core Zone 1 compiled to WebAssembly for in-app use (Node/Vercel + browser)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Pure-Rust Office (docx/pptx/xlsx) -> PDF. Enabled for the Node/server build;
# excluded from the browser build (bundles Typst — large payload).
office = ["pdf-core/office"]

[dependencies]
pdf-core = { path = "..", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
